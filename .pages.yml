# Pages CMS 配置：决定后台里能看到哪些可编辑内容
# 后台地址：https://app.pagescms.org

media:
  - name: images
    label: 图片
    input: assets/img/uploads
    output: assets/img/uploads
    categories: [image]
  - name: video
    label: 视频
    input: assets/video
    output: assets/video
    categories: [video]

content:
  - name: site
    label: 网站设置与首页
    type: file
    path: content/site.json
    format: json
    fields:
      - name: companyName
        label: 公司名称（中文）
        type: string
        required: true
      - name: companyNameEn
        label: 公司名称（英文）
        type: string
      - name: shortName
        label: 公司简称
        type: string
      - name: slogan
        label: 企业口号
        type: string
      - name: seoTitle
        label: 浏览器标签标题
        type: string
      - name: seoDescription
        label: 搜索描述
        type: text
      - name: nav
        label: 顶部导航
        type: object
        list: true
        fields:
          - name: label
            label: 名称
            type: string
            required: true
          - name: href
            label: 链接文件名
            type: string
            required: true
      - name: headerCta
        label: 顶部按钮
        type: object
        fields:
          - name: label
            label: 按钮文字
            type: string
          - name: href
            label: 按钮链接
            type: string
      - name: hero
        label: 首页首屏
        type: object
        fields:
          - name: eyebrow
            label: 上方小字
            type: string
          - name: title
            label: 主标题（换行处按回车）
            type: text
          - name: subtitle
            label: 说明文字
            type: text
          - name: primaryCta
            label: 主按钮
            type: object
            fields:
              - name: label
                label: 按钮文字
                type: string
              - name: href
                label: 按钮链接
                type: string
          - name: secondaryCta
            label: 次按钮
            type: object
            fields:
              - name: label
                label: 按钮文字
                type: string
              - name: href
                label: 按钮链接
                type: string
          - name: image
            label: 首屏图片
            type: image
            options:
              media: images
          - name: imageCaption
            label: 图片说明
            type: string
      - name: stats
        label: 首页数据看板
        type: object
        list: true
        fields:
          - name: value
            label: 数字
            type: string
            required: true
          - name: unit
            label: 单位
            type: string
          - name: label
            label: 说明
            type: string
      - name: statsNote
        label: 数据看板小字说明
        type: string
      - name: capabilities
        label: 业务方向
        type: object
        list: true
        fields:
          - name: title
            label: 标题
            type: string
          - name: desc
            label: 说明
            type: text
          - name: icon
            label: 图标
            type: select
            options:
              values:
                - name: robot
                  label: 机器人
                - name: plant
                  label: 工厂
                - name: conveyor
                  label: 输送线
                - name: parts
                  label: 备件
      - name: homeAbout
        label: 首页公司简介
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: paragraphs
            label: 段落
            type: text
            list: true
          - name: points
            label: 要点
            type: string
            list: true
      - name: afterSale
        label: 首页售后服务
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: items
            label: 条目
            type: object
            list: true
            fields:
              - name: title
                label: 小标题
                type: string
              - name: desc
                label: 说明
                type: text
      - name: footer
        label: 页脚
        type: object
        fields:
          - name: note
            label: 版权说明
            type: string
          - name: quickLinksTitle
            label: 导航栏标题
            type: string
          - name: contactTitle
            label: 联系栏标题
            type: string

  - name: about
    label: 企业简介
    type: file
    path: content/about.json
    format: json
    fields:
      - name: title
        label: 页面标题
        type: string
      - name: lead
        label: 一句话简介
        type: text
      - name: intro
        label: 公司简介段落
        type: text
        list: true
      - name: introImage
        label: 简介配图
        type: image
        options:
          media: images
      - name: performance
        label: 公司业绩
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: paragraphs
            label: 段落
            type: text
            list: true
          - name: highlights
            label: 关键数据
            type: object
            list: true
            fields:
              - name: value
                label: 数字
                type: string
              - name: unit
                label: 单位
                type: string
              - name: label
                label: 说明
                type: string
      - name: productMix
        label: 设备构成
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: note
            label: 小字说明
            type: string
          - name: items
            label: 条目
            type: object
            list: true
            fields:
              - name: label
                label: 设备名称
                type: string
              - name: value
                label: 数值（用于画条）
                type: number
              - name: display
                label: 显示文字
                type: string
      - name: culture
        label: 企业文化
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: items
            label: 条目
            type: object
            list: true
            fields:
              - name: title
                label: 名称
                type: string
              - name: desc
                label: 内容
                type: string
              - name: tone
                label: 配色
                type: select
                options:
                  values:
                    - name: primary
                      label: 蓝色
                    - name: dark
                      label: 深灰
      - name: team
        label: 团队介绍
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: paragraphs
            label: 段落
            type: text
            list: true
          - name: image
            label: 配图
            type: image
            options:
              media: images
      - name: timeline
        label: 发展历程
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: items
            label: 时间点
            type: object
            list: true
            fields:
              - name: year
                label: 时间
                type: string
              - name: text
                label: 事件
                type: text

  - name: products
    label: 产品中心（可新增、编辑、上下架）
    type: file
    path: content/products.json
    format: json
    list: true
    fields:
      - name: name
        label: 产品名称
        type: string
        required: true
      - name: nameEn
        label: 英文名称
        type: string
      - name: slug
        label: 页面锚点（英文小写，不要重复）
        type: string
        required: true
      - name: category
        label: 分类
        type: select
        options:
          values:
            - 装箱设备
            - 包装设备
            - 检测设备
            - 输送系统
            - 工程服务
            - 备件代理
      - name: status
        label: 上架状态
        type: select
        options:
          values:
            - name: published
              label: 已上架
            - name: hidden
              label: 已下架
      - name: featured
        label: 在首页展示
        type: boolean
      - name: summary
        label: 一句话卖点
        type: text
      - name: description
        label: 详细说明
        type: text
        list: true
      - name: features
        label: 产品特点
        type: string
        list: true
      - name: specs
        label: 技术参数
        type: object
        list: true
        fields:
          - name: label
            label: 参数名
            type: string
          - name: value
            label: 参数值
            type: string
      - name: images
        label: 产品图片（建议 16:9）
        type: object
        list: true
        fields:
          - name: src
            label: 图片
            type: image
            options:
              media: images
              categories: [image]
          - name: caption
            label: 图片说明
            type: string

  - name: cases
    label: 客户与案例
    type: file
    path: content/cases.json
    format: json
    fields:
      - name: title
        label: 页面标题
        type: string
      - name: lead
        label: 一句话简介
        type: text
      - name: summary
        label: 顶部数据
        type: object
        fields:
          - name: total
            label: 交付台数
            type: string
          - name: unit
            label: 单位
            type: string
          - name: period
            label: 统计年份
            type: string
          - name: customers
            label: 客户家数
            type: string
          - name: note
            label: 口径说明
            type: text
      - name: map
        label: 地图板块
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: desc
            label: 说明
            type: text
          - name: note
            label: 底部小字
            type: text
          - name: legend
            label: 图例
            type: object
            list: true
            fields:
              - name: label
                label: 名称
                type: string
              - name: color
                label: 颜色（十六进制）
                type: string
      - name: cities
        label: 城市清单
        type: object
        list: true
        fields:
          - name: name
            label: 城市
            type: string
            required: true
          - name: region
            label: 区域
            type: select
            options:
              values: [东北, 内蒙古, 华北, 西北, 华东, 华中西南, 华南]
          - name: brands
            label: 合作品牌
            type: string
            list: true
          - name: lon
            label: 经度
            type: number
          - name: lat
            label: 纬度
            type: number
          - name: isHQ
            label: 是否总部所在地
            type: boolean
      - name: customers
        label: 典型客户
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: note
            label: 说明
            type: string
          - name: items
            label: 客户
            type: object
            list: true
            fields:
              - name: name
                label: 客户名称
                type: string
              - name: logo
                label: Logo
                type: image
                options:
                  media: images
      - name: projects
        label: 历史项目清单
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: desc
            label: 说明
            type: text
          - name: columns
            label: 表头
            type: string
            list: true
          - name: filters
            label: 筛选按钮
            type: object
            list: true
            fields:
              - name: label
                label: 按钮文字
                type: string
              - name: value
                label: 对应设备型号
                type: string
          - name: rows
            label: 交付记录
            type: object
            list: true
            fields:
              - name: customer
                label: 客户名称
                type: string
                required: true
              - name: date
                label: 签约时间
                type: string
              - name: model
                label: 设备型号
                type: string
              - name: qty
                label: 数量（台）
                type: number

  - name: honors
    label: 资质荣誉
    type: file
    path: content/honors.json
    format: json
    fields:
      - name: title
        label: 页面标题
        type: string
      - name: lead
        label: 一句话简介
        type: text
      - name: reviewNote
        label: 底部说明
        type: text
      - name: groups
        label: 证书分组
        type: object
        list: true
        fields:
          - name: title
            label: 分组名称
            type: string
          - name: desc
            label: 分组说明
            type: text
          - name: items
            label: 证书
            type: object
            list: true
            fields:
              - name: title
                label: 名称
                type: string
              - name: caption
                label: 补充说明
                type: string
              - name: image
                label: 证书图片
                type: image
                options:
                  media: images

  - name: contact
    label: 联系我们
    type: file
    path: content/contact.json
    format: json
    fields:
      - name: title
        label: 页面标题
        type: string
      - name: lead
        label: 一句话简介
        type: text
      - name: primary
        label: 业务联系
        type: object
        fields:
          - name: label
            label: 小标题
            type: string
          - name: name
            label: 联系人
            type: string
          - name: mobile
            label: 手机号
            type: string
          - name: phone
            label: 固定电话
            type: string
          - name: email
            label: 邮箱
            type: string
      - name: address
        label: 公司地址
        type: object
        fields:
          - name: label
            label: 小标题
            type: string
          - name: text
            label: 地址
            type: string
          - name: note
            label: 说明
            type: text
      - name: hours
        label: 工作时间
        type: object
        fields:
          - name: label
            label: 小标题
            type: string
          - name: text
            label: 时间
            type: string
          - name: note
            label: 说明
            type: text
      - name: email
        label: 邮件咨询
        type: object
        fields:
          - name: label
            label: 小标题
            type: string
          - name: text
            label: 说明
            type: text
          - name: button
            label: 按钮文字
            type: string
      - name: form
        label: 在线咨询表单
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: note
            label: 说明
            type: text
          - name: submit
            label: 按钮文字
            type: string
          - name: fields
            label: 输入框提示文字
            type: object
            fields:
              - name: name
                label: 称呼
                type: string
              - name: company
                label: 公司名称
                type: string
              - name: phone
                label: 联系电话
                type: string
              - name: message
                label: 需求描述
                type: string
      - name: afterSale
        label: 售后服务承诺
        type: object
        fields:
          - name: title
            label: 标题
            type: string
          - name: items
            label: 条目
            type: string
            list: true
